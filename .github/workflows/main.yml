name: build and test
on: 
  push:
    branches:
      - develop
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: checkout respository
      uses: actions/checkout@v3
      
    - name: setup node.js
      uses: actions/setup-node@v3  # 升级到 v3
      with: 
        node-version: '18.x'  # 使用 18.x 自动获取最新 LTS 版本
        
    - name: setup yarn
      run: npm install -g yarn
      
    - name: install depencies
      run: yarn
      
    - name: build
      run: yarn build
      
    - name: Deploy 🚀
      uses: JamesIves/github-pages-deploy-action@releases/v4  # 建议升级到 v4
      with:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        BRANCH: gh-pages
        FOLDER: dist
